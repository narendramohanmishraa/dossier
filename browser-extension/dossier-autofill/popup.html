<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dossier Autofill</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Dossier Autofill</h1>
      <p class="hint">Import your reduced profile export once. It stays in this browser's local extension storage.</p>
      <label class="file-label" for="profile-file">Import Dossier profile JSON</label>
      <input id="profile-file" type="file" accept=".json,application/json">
      <p id="profile-state" class="state" role="status">No profile loaded.</p>
      <button id="fill" disabled>Fill this page</button>
      <button id="clear" class="secondary" disabled>Clear stored profile</button>
      <p id="result" class="result" role="status"></p>
      <p class="footnote">Review every field. File uploads and application submission are never automated.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
