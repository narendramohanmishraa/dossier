name: Actions startup smoke test

on:
  push:
    branches: [feat/india-hourly-job-agent]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dossier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Confirm runner and database startup
        run: |
          echo "Runner started successfully."
          pg_isready -h localhost -p 5432 -U postgres
