name: Actions startup smoke test

on:
  push:
    branches: [feat/india-hourly-job-agent]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify checkout
        run: |
          test -f package.json
          echo "Checkout action works."
