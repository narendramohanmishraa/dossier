name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/india-hourly-job-agent]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm CI workflow starts
        run: echo "CI workflow started on $GITHUB_REF at $GITHUB_SHA"
